<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro Completado - Conquer Blocks</title>
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="genfavicon-32.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <meta name="theme-color" content="#fafafa" />
    <link rel="stylesheet" href="sass/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@300..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="main-main" class="register-page dotted">
      <div class="register-container">
        <div class="register__fieldset" style="text-align: center">
          <h1 class="register__title">¡Operación realizada correctamente!</h1>
          <p
            class="register__description"
            style="
              color: var(--color-bg-main);
              margin-bottom: 2rem;
              font-size: 1.15rem;
              line-height: 1.6rem;
            "
          >
            Tus datos han sido procesados. Si es necesario, en breve nos
            pondremos en contacto contigo.
          </p>

          <div>
            <a
              href="index.html"
              class="register__btn register__btn--submit"
              style="text-decoration: none; display: inline-block"
            >
              Volver al inicio
            </a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
