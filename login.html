<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Login | Academia Conquer Blocks</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Accede a tu cuenta en Academia Conquer Blocks."
    />

    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="genfavicon-32.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <meta name="theme-color" content="#fafafa" />
    <link rel="stylesheet" href="./sass/style.css" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@300..800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <load src="./header.html" />

    <main class="main-main login-page dotted">
      <div class="container">
        <div class="login__container">
          <header class="login__header">
            <h1 class="login__title">Iniciar Sesión</h1>
            <p class="login__description">
              Introduce tus credenciales para acceder.
            </p>
          </header>

          <form action="exito.html" method="POST" class="login__form">
            <fieldset class="login__fieldset">
              <legend class="login__legend">Acceso de Usuario</legend>

              <div class="login__group">
                <label for="login_email" class="login__label"
                  >Correo Electrónico:</label
                >
                <input
                  type="email"
                  id="login_email"
                  name="email"
                  class="login__input"
                  placeholder="ejemplo@dominio.com"
                  required
                />
              </div>

              <div class="login__group">
                <label for="login_password" class="login__label"
                  >Contraseña:</label
                >
                <input
                  type="password"
                  id="login_password"
                  name="password"
                  class="login__input"
                  placeholder="********"
                  required
                />
              </div>
            </fieldset>

            <div class="login__actions">
              <button type="submit" class="btn">Acceder</button>
            </div>
          </form>
        </div>
      </div>
    </main>

    <load src="./footer.html" />
  </body>
</html>
