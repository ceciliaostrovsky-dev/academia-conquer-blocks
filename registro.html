<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Registro en Academia Conquer Blocks</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Completa el formulario de registro para unirte a nuestra academia."
    />

    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="genfavicon-32.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@300..800&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="/main.js"></script>

    <meta name="theme-color" content="#fafafa" />
  </head>

  <body>
    <load src="./header.html" />

    <main class="main-main register-page dotted">
      <div class="container">
        <header class="register-header">
          <h1 class="register__title">
            Bienvenido a la Academia Conquer Blocks
          </h1>
          <p class="register__description">
            Únete a nuestra comunidad de aprendizaje y lleva tus habilidades
            tecnológicas al siguiente nivel.
          </p>
        </header>

        <!-- UN SOLO FORMULARIO QUE REDIRIGE A EXITO.HTML -->
        <form action="exito.html" method="GET" class="register__form">
          <!-- SECCIÓN 1: INFORMACIÓN PERSONAL -->
          <fieldset class="register__fieldset">
            <legend class="register__legend">Información Personal</legend>

            <div class="register__group">
              <label for="nombre" class="register__label"
                >Nombre Completo*:</label
              >
              <input
                type="text"
                id="nombre"
                name="nombre"
                class="register__input"
                placeholder="Ej: Juan Pérez"
                required
              />
            </div>

            <div class="register__group">
              <label for="nacimiento" class="register__label"
                >Fecha de nacimiento*:</label
              >
              <input
                type="date"
                id="nacimiento"
                name="nacimiento"
                class="register__input register__input--date"
                min="1950-01-01"
                max="2007-12-31"
                required
              />
            </div>

            <div class="register__group">
              <label for="email" class="register__label"
                >Correo Electrónico*:</label
              >
              <input
                type="email"
                id="email"
                name="email"
                placeholder="ejemplo@dominio.com"
                class="register__input"
                required
              />
            </div>

            <div class="register__group">
              <label for="direccion" class="register__label"
                >Dirección Completa*:</label
              >
              <input
                type="text"
                id="direccion"
                name="direccion"
                class="register__input"
                placeholder="Calle, Número, Ciudad, Código Postal"
                required
              />
            </div>
          </fieldset>

          <!-- SECCIÓN 2: DATOS ADICIONALES -->
          <fieldset class="register__fieldset">
            <legend class="register__legend">Datos adicionales</legend>

            <div class="register__group">
              <label for="pagina_web" class="register__label"
                >Página Web/Portafolio (URL):</label
              >
              <input
                type="url"
                id="pagina_web"
                name="pagina_web"
                placeholder="https://www.ejemplo.com"
                class="register__input"
              />
            </div>

            <div class="register__group">
              <label for="foto" class="register__label">Foto de perfil:</label>
              <input
                type="file"
                id="foto"
                name="foto"
                accept="image/*"
                class="register__file-input"
              />
            </div>

            <div class="register__group">
              <label for="biografia" class="register__label"
                >Biografía o Experiencia:</label
              >
              <textarea
                id="biografia"
                name="biografia"
                rows="5"
                class="register__textarea"
                placeholder="Describe brevemente tu experiencia y motivación."
              ></textarea>
            </div>
          </fieldset>

          <!-- BOTONES DE ACCIÓN -->
          <div class="register__actions">
            <button type="submit" class="register__btn register__btn--submit">
              Enviar Registro
            </button>
            <button type="reset" class="register__btn register__btn--reset">
              Limpiar Formulario
            </button>
          </div>
        </form>
      </div>
    </main>

    <load src="./footer.html" />
  </body>
</html>
